<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/" />
  <title>織語 - 模板庫</title>
  <script>
  (function(){
    // 過濾 console 噪音訊息（WebSocket BFCACHE、Undefined startTime）
    const filter = function(msg){
      return typeof msg === 'string' && (
        (msg.includes('WebSocket connection') && msg.includes('Page entered Back-Forward Cache')) ||
        (msg.includes('Cannot read properties of undefined') && msg.includes('startTime'))
      );
    };
    const origError = console.error;
    console.error = function(...args){ if (filter(args[0])) return; return origError.apply(this,args); };
    const origWarn = console.warn;
    console.warn = function(...args){ if (filter(args[0])) return; return origWarn.apply(this,args); };
    window.onerror = function(){return true;};
    window.addEventListener('error', function(e){
      const msg = e.message || (e.error && e.error.message) || '';
      if (msg.includes('Back-Forward Cache') || (msg.includes('Cannot read properties of undefined') && msg.includes('startTime'))){
        e.stopPropagation(); e.preventDefault(); console.debug('Ignored error via early handler');
      }
    }, true);
    const socketSet = new Set();
    const OrigWS = window.WebSocket;
    function TrackingWebSocket(...args){
      const ws = new OrigWS(...args);
      socketSet.add(ws);
      ws.addEventListener('close', () => socketSet.delete(ws));
      return ws;
    }
    TrackingWebSocket.prototype = OrigWS.prototype;
    window.WebSocket = TrackingWebSocket;
    window.addEventListener('pagehide', () => {
      socketSet.forEach(ws => { try{ ws.close(); }catch(e){} });
      socketSet.clear();
    });
    window.addEventListener('pageshow', e => { if (e.persisted) window.location.reload(); });
  })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script>
  (function(){
    function shouldIgnore(args){
      for (const a of args){
        if (typeof a === 'string'){
          if (a.includes('WebSocket connection') && a.includes('Page entered Back-Forward Cache')) return true;
          if (a.includes('Cannot read properties of undefined') && a.includes('startTime')) return true;
        }
        if (a && typeof a.message === 'string'){
          if (a.message.includes('WebSocket connection') && a.message.includes('Page entered Back-Forward Cache')) return true;
          if (a.message.includes('Cannot read properties of undefined') && a.message.includes('startTime')) return true;
        }
      }
      return false;
    }
    const origError = console.error;
    console.error = function(...args){ if (shouldIgnore(args)) return; return origError.apply(this,args); };
    const origWarn = console.warn;
    console.warn = function(...args){ if (shouldIgnore(args)) return; return origWarn.apply(this,args); };
    window.addEventListener('unhandledrejection', e => {
      if (shouldIgnore([e.reason])){ e.preventDefault(); console.debug('Ignored unhandled promise rejection'); }
    });
  })();
  </script>
  <script src="et-wrapper.js"></script>
  <!-- Supabase SDK & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="flex items-center justify-start h-screen overflow-hidden antialiased selection:bg-gray-200 selection:text-gray-900 bg-[#fbfbfa]">
  <div class="flex w-full h-full">
    <div class="flex w-1/2 items-center justify-center">
      <img src="logo.png" alt="Logo" class="w-64 h-64" style="opacity:0.75;">
    </div>
    <div class="flex flex-col w-1/2 h-full items-center justify-center space-y-4">
      <h1 class="text-3xl font-bold text-center mb-4">模板庫</h1>

      <button id="blank-template"
              class="self-center py-2 text-sm bg-gray-200 text-gray-800 rounded hover:bg-gray-300 font-medium transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>新增空白模板
      </button>

      <div id="template-list" class="flex flex-col space-y-1 mt-3"></div>
    </div>
  </div>

  <script>
  (function() {
    if (typeof DOMPurify === 'undefined') {
      window.DOMPurify = {
        sanitize: function(dirty) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(dirty, 'text/html');
          doc.querySelectorAll('script,style').forEach(el => el.remove());
          const all = doc.body.getElementsByTagName('*');
          for (let i = 0; i < all.length; i++) {
            const attrs = all[i].attributes;
            for (let j = attrs.length - 1; j >= 0; j--) {
              const name = attrs[j].name;
              if (name.startsWith('on')) all[i].removeAttribute(name);
            }
          }
          return doc.body.innerHTML;
        }
      };
    }

    const listEl = document.getElementById('template-list');
    const blankBtn = document.getElementById('blank-template');

    async function loadTemplates() {
      const tpls = await readTemplateLibrary();
      return JSON.parse(JSON.stringify(tpls));
    }

    async function saveTemplates(tpls) {
      await writeTemplateLibrary(tpls);
    }

    function generateId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return `tpl_${window.crypto.randomUUID()}`;
      }
      return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}_${Math.random().toString(36).slice(2)}`;
    }

    async function renderList() {
      const tpls = await loadTemplates();
      listEl.innerHTML = '';
      if (tpls.length === 0) {
        listEl.innerHTML = '<div class="text-xs text-gray-400 text-right py-4 border border-dashed rounded">尚未建立任何自訂模板</div>';
        return;
      }
      tpls.forEach(tpl => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-gray-100 rounded shadow p-3 mb-2 relative flex items-center justify-between';
        if (tpl.thumbnail) {
          const thumb = document.createElement('img');
          thumb.src = tpl.thumbnail;
          thumb.alt = 'Template thumbnail';
          thumb.className = 'w-12 h-12 object-cover rounded mr-2';
          wrapper.appendChild(thumb);
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'flex-1 text-left py-1.5 px-3 bg-gray-100 text-gray-800 rounded hover:bg-gray-200 truncate text-sm font-medium transition-colors';
        btn.textContent = tpl.name || '未命名模板';
        btn.title = tpl.name;
        btn.dataset.id = tpl.id;
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          localStorage.setItem('lastTemplateId', id);
          localStorage.removeItem('selectedTemplate');
          localStorage.setItem('selectedTemplateId', id);
          window.location.href = '/editor.html';
        });

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="m15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 1 1 3.536 3.536L6.5 21.036H3v-3.572z"/></svg>';
        edit.title = '重新命名';
        edit.className = 'ml-1 p-1 hover:bg-gray-100 rounded text-sm';
        edit.addEventListener('click', e => { e.stopPropagation(); editTemplate(tpl.id); });

        const del = document.createElement('button');
        del.type = 'button';
        del.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
        del.title = '刪除模板';
        del.className = 'ml-1 p-1 hover:bg-red-50 rounded text-sm text-red-500';
        del.addEventListener('click', e => { e.stopPropagation(); deleteTemplate(tpl.id); });

        const timeDiv = document.createElement('div');
        timeDiv.className = 'text-xs text-gray-500';
        timeDiv.textContent = tpl.lastEdited ? '最後編輯：' + new Date(tpl.lastEdited).toLocaleString() : '最後編輯：-';

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'flex items-center space-x-2';
        actionsDiv.appendChild(edit);
        actionsDiv.appendChild(del);
        actionsDiv.appendChild(timeDiv);

        wrapper.appendChild(btn);
        wrapper.appendChild(actionsDiv);
        listEl.appendChild(wrapper);
      });
    }

    async function editTemplate(id) {
      const tpls = await loadTemplates();
      const idx = tpls.findIndex(t => t.id === id);
      if (idx === -1) { alert('未找到模板'); return; }
      const newName = window.prompt('模板名稱', tpls[idx].name);
      if (!newName) return;
      tpls[idx].name = newName.trim();
      tpls[idx].lastEdited = Date.now();
      await saveTemplates(tpls);
      await renderList();
    }

    async function deleteTemplate(id) {
      if (!confirm('確定刪除這個模板嗎？記錄將會被移除。')) return;
      const tpls = await loadTemplates();
      const idx = tpls.findIndex(t => t.id === id);
      if (idx === -1) { alert('未找到模板'); return; }
      tpls.splice(idx, 1);
      await saveTemplates(tpls);
      if (localStorage.getItem('selectedTemplateId') === id) localStorage.removeItem('selectedTemplateId');
      if (localStorage.getItem('lastTemplateId') === id) localStorage.removeItem('lastTemplateId');
      if (localStorage.getItem('selectedTemplate') === id) localStorage.removeItem('selectedTemplate');
      await renderList();
    }

    // 新增空白模板 → 直接跳至 editor.html
    blankBtn.addEventListener('click', () => {
      localStorage.removeItem('selectedTemplate');
      localStorage.removeItem('selectedTemplateId');
      window.location.href = '/editor.html';
    });

    renderList();
  })();
  </script>
</body>
</html>
